name: Feature request
description: Propose a focused improvement to a public Commons project.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result without prescribing unnecessary implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing approaches or workarounds you considered.
  - type: textarea
    id: impact
    attributes:
      label: Contract and operational impact
      description: Note compatibility, security, data, cost, or migration implications.
